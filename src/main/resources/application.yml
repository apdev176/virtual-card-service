spring:
  application:
    name: virtual-card-service
  datasource:
    url: jdbc:h2:mem:carddb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false # Disable console spam, we use logger now
    properties:
      hibernate:
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

logging:
  level:
    root: INFO
    com.company.virtual.card.service: DEBUG # Show debug logs for our code
    org.hibernate.SQL: DEBUG    # Log SQL queries properly